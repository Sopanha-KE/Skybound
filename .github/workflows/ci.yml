name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/windows-msvc-debug/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset windows-msvc-debug
      - run: cmake --build --preset windows-msvc-debug
      - run: ctest --preset windows-msvc-debug
        env:
          SDL_VIDEODRIVER: dummy

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/linux-ci/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset linux-ci
      - run: cmake --build --preset linux-ci
      - run: ctest --preset linux-ci
        env:
          SDL_VIDEODRIVER: dummy
